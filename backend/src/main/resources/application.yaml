server:
  shutdown: graceful

spring:
  application:
    name: codex-of-realms
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/codex_of_realms}
    username: ${DB_USERNAME:codex}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 5s
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/codex-of-realms}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/codex-of-realms/protocol/openid-connect/certs}
          audiences:
            - ${OIDC_AUDIENCE:codex-api}
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding: ${AI_EMBEDDING_PROVIDER:none}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
  modulith:
    runtime:
      verification-enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,applicationmodules
  info:
    env:
      enabled: true

info:
  application:
    name: Codex of Realms
    milestone: M2

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
