# Access pages with the application's look and voice. Everything not listed here comes from keycloak.v2.
# resources/img/favicon.ico is frontend/public/favicon.svg rendered at 16, 32 and 48 px.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/codex.css

# The application is dark only, so the access pages do not follow the system light scheme.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

# Keycloak announces its steps (confirm the email, choose a password) as warnings; they are instructions.
kcFeedbackWarningIcon=fa fa-fw fa-info-circle
