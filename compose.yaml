name: codex-of-realms

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: codex_of_realms
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex -d codex_of_realms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/codex_of_realms
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: codex
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - "8180:8080"
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/keycloak/codex-of-realms-realm.json:/opt/keycloak/data/import/codex-of-realms-realm.json:ro

  keycloak-db-init:
    image: postgres:18.1-trixie
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - psql
      - --host=postgres
      - --username=codex
      - --dbname=codex_of_realms
      - --command=CREATE SCHEMA IF NOT EXISTS keycloak AUTHORIZATION codex
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.32.5
    environment:
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/codex_of_realms
      DB_USERNAME: codex
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OIDC_ISSUER_URI: http://localhost:8180/realms/codex-of-realms
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/codex-of-realms/protocol/openid-connect/certs
      OIDC_AUDIENCE: codex-api
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      AI_CHAT_PROVIDER: ollama
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:4b}
      AI_EMBEDDING_PROVIDER: ollama
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-bge-m3}
      CODEX_SOURCE_STORAGE: /app/data/sources
    depends_on:
      keycloak:
        condition: service_healthy
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "8080:8080"
    volumes:
      - source-data:/app/data/sources

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_KEYCLOAK_URL: http://localhost:8180
        VITE_KEYCLOAK_REALM: codex-of-realms
        VITE_KEYCLOAK_CLIENT_ID: codex-web
    depends_on:
      app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "5173:8080"

volumes:
  ollama-data:
  postgres-data:
  source-data:
