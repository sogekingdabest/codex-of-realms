name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify web application
        working-directory: frontend
        run: |
          npm run lint
          npm run test
          npm run build

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder-not-a-secret
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.restore-check.yaml config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml --profile observability config --quiet
