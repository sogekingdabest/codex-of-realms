name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_FRONTEND_PROJECT_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify web application
        working-directory: frontend
        run: npm run verify

      - name: Validate frontend Sonar configuration
        if: ${{ vars.SONAR_ENFORCE == 'true' }}
        shell: bash
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::SONAR_TOKEN is required while SONAR_ENFORCE=true"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::SONAR_ORGANIZATION is required while SONAR_ENFORCE=true"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::SONAR_FRONTEND_PROJECT_KEY is required while SONAR_ENFORCE=true"; exit 1; }

      - name: Analyze frontend with SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        continue-on-error: ${{ vars.SONAR_ENFORCE != 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_BACKEND_PROJECT_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Verify
        working-directory: backend
        run: |
          ./mvnw --batch-mode --no-transfer-progress verify
          test -s target/site/jacoco/jacoco.xml

      - name: Validate backend Sonar configuration
        if: ${{ vars.SONAR_ENFORCE == 'true' || vars.SONAR_ENFORCE == 'backend' }}
        shell: bash
        run: |
          test -n "$SONAR_TOKEN" || { echo "::error::SONAR_TOKEN is required while SONAR_ENFORCE=true"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "::error::SONAR_ORGANIZATION is required while SONAR_ENFORCE=true"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::SONAR_BACKEND_PROJECT_KEY is required while SONAR_ENFORCE=true"; exit 1; }

      - name: Analyze backend with SonarQube Cloud
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' && env.SONAR_PROJECT_KEY != '' }}
        continue-on-error: ${{ vars.SONAR_ENFORCE != 'true' && vars.SONAR_ENFORCE != 'backend' }}
        working-directory: backend
        run: >
          ./mvnw --batch-mode --no-transfer-progress
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey="$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder-not-a-secret
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.restore-check.yaml config --quiet
          docker compose -f compose.yaml -f compose.observability.yaml --profile observability config --quiet
          docker compose -f compose.e2e.yaml config --quiet

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start isolated browser stack
        run: docker compose -f compose.e2e.yaml up -d --build --wait --wait-timeout 300

      - name: Verify browser workflows
        working-directory: frontend
        run: npm run test:e2e

      - name: Print service diagnostics on failure
        if: failure()
        run: docker compose -f compose.e2e.yaml logs --tail 100

      - name: Remove isolated test resources
        if: always()
        run: docker compose -f compose.e2e.yaml down --volumes --remove-orphans
