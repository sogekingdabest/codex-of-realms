version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1. Remove this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      non-major:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
